<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 470" role="img" aria-label="A blue police public call box">
  <defs>
    <linearGradient id="boxG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173a6b"/>
      <stop offset="0.5" stop-color="#1b4076"/>
      <stop offset="1" stop-color="#0f2c56"/>
    </linearGradient>
    <linearGradient id="paneG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e6ef"/>
      <stop offset="1" stop-color="#a7c6da"/>
    </linearGradient>
  </defs>

  <!-- lamp -->
  <rect x="145" y="4" width="10" height="5" fill="#0e2547"/>
  <rect x="146.5" y="9" width="7" height="11" rx="2.5" fill="#f4efe2"/>
  <ellipse cx="150" cy="9" rx="6" ry="2.6" fill="#0e2547"/>
  <ellipse cx="150" cy="20" rx="6" ry="2.6" fill="#0e2547"/>

  <!-- roof tiers -->
  <rect x="122" y="22" width="56" height="12" rx="1.5" fill="#0f2c56"/>
  <rect x="100" y="34" width="100" height="13" rx="1.5" fill="#173a6b"/>
  <rect x="80"  y="47" width="140" height="15" rx="1.5" fill="#1b4076"/>
  <rect x="75"  y="62" width="150" height="10" fill="#0e2547"/>

  <!-- sign band -->
  <rect x="80" y="72" width="140" height="22" fill="#f4efe2"/>
  <rect x="80" y="72" width="140" height="22" fill="none" stroke="#0e2547" stroke-width="1.5"/>
  <text x="150" y="87" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" letter-spacing="0.9" fill="#1b4076">POLICE&#160;&#160;PUBLIC&#160;CALL&#160;&#160;BOX</text>

  <!-- body -->
  <rect x="80" y="94" width="140" height="338" fill="url(#boxG)"/>
  <rect x="80" y="94" width="140" height="338" fill="none" stroke="#0e2547" stroke-width="2"/>
  <!-- corner pilasters -->
  <rect x="80" y="94" width="7" height="338" fill="#0f2c56"/>
  <rect x="213" y="94" width="7" height="338" fill="#0f2c56"/>
  <!-- centre divider -->
  <rect x="148" y="94" width="4" height="338" fill="#0e2547"/>

  <!-- windows: frosted, 2 x 3 panes each door -->
  <g stroke="#0e2547" stroke-width="1.3">
    <rect x="93"  y="104" width="50" height="44" fill="url(#paneG)"/>
    <line x1="118" y1="104" x2="118" y2="148"/>
    <line x1="93"  y1="118.7" x2="143" y2="118.7"/>
    <line x1="93"  y1="133.3" x2="143" y2="133.3"/>
    <rect x="157" y="104" width="50" height="44" fill="url(#paneG)"/>
    <line x1="182" y1="104" x2="182" y2="148"/>
    <line x1="157" y1="118.7" x2="207" y2="118.7"/>
    <line x1="157" y1="133.3" x2="207" y2="133.3"/>
  </g>

  <!-- door panels: upper + lower on each leaf -->
  <g fill="#12305c" stroke="#0e2547" stroke-width="1.3">
    <rect x="92"  y="160" width="52" height="128"/>
    <rect x="92"  y="296" width="52" height="128"/>
    <rect x="156" y="160" width="52" height="128"/>
    <rect x="156" y="296" width="52" height="128"/>
  </g>
  <g fill="none" stroke="#27528b" stroke-width="1">
    <rect x="96"  y="164" width="44" height="120"/>
    <rect x="96"  y="300" width="44" height="120"/>
    <rect x="160" y="164" width="44" height="120"/>
    <rect x="160" y="300" width="44" height="120"/>
  </g>

  <!-- PULL TO OPEN instruction notice (right leaf) -->
  <rect x="160" y="166" width="44" height="64" fill="#f4efe2" stroke="#0e2547" stroke-width="1"/>
  <text x="182" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="4.2" fill="#1b4076">POLICE TELEPHONE</text>
  <g stroke="#8a97a6" stroke-width="0.8">
    <line x1="165" y1="182" x2="199" y2="182"/>
    <line x1="165" y1="187" x2="199" y2="187"/>
    <line x1="165" y1="192" x2="199" y2="192"/>
    <line x1="165" y1="197" x2="199" y2="197"/>
    <line x1="167" y1="202" x2="197" y2="202"/>
  </g>
  <rect x="163" y="216" width="38" height="10" fill="#1b4076"/>
  <text x="182" y="223.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="5.2" letter-spacing="0.3" fill="#f4efe2">PULL TO OPEN</text>

  <!-- handle -->
  <circle cx="143" cy="240" r="2.6" fill="#d8cfa8"/>

  <!-- plinth base -->
  <rect x="76" y="432" width="148" height="18" fill="#0f2c56"/>
  <rect x="76" y="432" width="148" height="18" fill="none" stroke="#0e2547" stroke-width="2"/>
  <rect x="70" y="450" width="160" height="9" fill="#0e2547"/>
</svg>
